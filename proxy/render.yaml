services:
  - type: web
    name: swiftstv-hls-proxy
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HLS_WAIT_MS
        value: "3500"
      - key: HLS_GOTO_TIMEOUT_MS
        value: "8000"
      - key: TOKEN_TTL_SECONDS
        value: "1800"
      - key: CACHE_TTL_SECONDS
        value: "1800"
      - key: SEGMENT_CACHE_MB
        value: "64"
      - key: SEGMENT_CACHE_TTL_SECONDS
        value: "25"
      - key: MAX_STREAMS_PER_SID
        value: "2"
      - key: STREAM_IDLE_SECONDS
        value: "30"
      - key: REQUIRE_SID
        value: "0"
      - key: PROXY_API_KEY
        sync: false
