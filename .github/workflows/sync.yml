name: Sync exclusive sources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-exclusive-sources
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Scrape agenda
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          OUTPUT_PATH: exclusive_sources.json
          REQUEST_TIMEOUT: "30"
          MAX_WORKERS: "8"
          AGENDA_WAIT_MS: "3000"
          HLS_WAIT_MS: "12000"
          USE_PLAYWRIGHT: "1"
          PROXY_BASE_URL: ${{ secrets.PROXY_BASE_URL }}
          EMBED_CATALOG_URL: |
            https://tudeporteshoy.xyz/
            https://futbol-libre-hd.com/
          PLAYER_TEMPLATE: "https://streamtp-golden1.click/global1.php?stream={stream}"
          PLAYER_HOST_REWRITE: "streamtp2.com=streamtp-golden1.click,streamtp3.com=streamtp-golden1.click"
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exclusive_sources.json
          if git diff --cached --quiet; then
            echo "No changes in exclusive_sources.json"
          else
            git commit -m "chore: update exclusive_sources.json"
            git push
          fi
